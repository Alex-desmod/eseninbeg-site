{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}404: страница не найдена{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="min-h-screen relative overflow-hidden bg-stone-200 text-neutral-900">

    <div class="absolute inset-0 pointer-events-none">
        <img src="{% static 'img/x.jpg' %}" alt=""
             class="absolute left-[20%] top-[20%] -translate-x-1/2 -translate-y-1/2 w-[150px] opacity-40">
        <img src="{% static 'img/z.jpg' %}" alt=""
             class="absolute left-1/2 top-[85%] -translate-x-1/2 -translate-y-1/2 w-[400px] opacity-35">
        <img src="{% static 'img/y.jpg' %}" alt=""
             class="absolute left-[62%] top-[57%] -translate-x-1/2 -translate-y-1/2 w-[300px] opacity-50 rotate-[15deg]">
    </div>

    <div class="relative min-h-screen flex items-center justify-center px-6">
        <div class="flex items-center gap-6">
            <span class="font-heading font-light text-6xl md:text-7xl leading-none">404</span>
            <span class="w-px h-16 md:h-20 bg-neutral-400"></span>
            <p class="font-sans text-base md:text-lg">This page could not be found.</p>
        </div>
    </div>

</body>
</html>
