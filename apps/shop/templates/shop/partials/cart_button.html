<div id="cart-button-wrapper" class="fixed bottom-6 right-6 z-40">
    {% if cart %}
    <button type="button"
            onclick="document.getElementById('checkout-dialog').showModal()"
            hx-get="{% url 'shop:checkout' %}"
            hx-target="#checkout-modal-content"
            hx-swap="innerHTML"
            aria-label="Корзина"
            class="relative bg-neutral-900 text-white rounded-full w-14 h-14 flex items-center justify-center
                   shadow-lg hover:bg-neutral-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        <span class="absolute -top-1 -right-1 bg-emerald-600 text-white text-xs font-medium rounded-full w-5 h-5 flex items-center justify-center">
            {{ cart|length }}
        </span>
    </button>
    {% endif %}
</div>
