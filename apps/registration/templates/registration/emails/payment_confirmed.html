<!DOCTYPE html>
<html lang="ru">
<body style="margin:0; padding:0; background:#f5f5f5; font-family:Arial, Helvetica, sans-serif; color:#171717;">
    <div style="max-width:600px; margin:24px auto; padding:24px; background:#ffffff; border-radius:8px;">
        <p style="margin:0 0 16px;">Здравствуйте, <strong>{{ registration.name }}</strong>!</p>
        <p style="margin:0 0 16px;">Ваша регистрация на <strong>"{{ event.title }}"</strong> подтверждена.</p>

        <div style="background:#f5f5f5; border-radius:8px; padding:16px; margin:0 0 16px; text-align:center;">
            <p style="margin:0 0 4px; color:#737373; font-size:13px;">Ваш стартовый номер</p>
            <p style="margin:0; font-size:32px; font-weight:700; letter-spacing:2px;">{{ registration.bib_number }}</p>
        </div>

        <table style="margin:0 0 16px; border-collapse:collapse;">
            <tr>
                <td style="padding:2px 16px 2px 0; color:#737373;">Дистанция</td>
                <td>{{ registration.distance.name }}</td>
            </tr>
        </table>

        <p style="margin:0 0 4px;">Вся информация о событии:</p>
        <p style="margin:0 0 16px;">
            <a href="{{ base_url }}{% url 'events:detail' event.slug %}" style="color:#047857;">
                {{ event.title }}
            </a>
        </p>

        <p style="margin:16px 0 0;">Ждем на старте!</p>
    </div>

</body>
</html>
